<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>English in Context | Digital Workbook B1–C2</title><style>
:root{--navy:#173d72;--blue:#2666a4;--mid:#5b95c6;--pale:#eaf3fb;--ink:#19324c;--line:#bed3e7;--white:#fff}*{box-sizing:border-box}body{margin:0;font-family:Arial,Verdana,sans-serif;color:var(--ink);background:#f3f7fb;font-size:16px;line-height:1.5}header{background:linear-gradient(115deg,#143762,#2b6eaa);color:white;padding:26px max(20px,calc((100vw - 1150px)/2))}header h1{font-family:Verdana,sans-serif;margin:0;font-size:27px}header p{margin:6px 0 0;color:#e7f2fc}.layout{max-width:1150px;margin:22px auto;display:grid;grid-template-columns:265px 1fr;gap:20px;padding:0 14px}.sidebar,.main{background:white;border:1px solid var(--line);border-radius:14px;padding:20px}.sidebar{align-self:start;position:sticky;top:12px}.sidebar h2{font-size:15px;color:var(--navy);margin:0 0 12px}.unitbtn{display:block;width:100%;text-align:left;border:1px solid transparent;background:white;border-radius:9px;padding:10px 9px;color:var(--ink);font-size:14px;cursor:pointer;margin-bottom:5px}.unitbtn:hover,.unitbtn.active{background:var(--pale);border-color:var(--line);color:var(--navy)}button{font-family:Arial,sans-serif;cursor:pointer}.primary,.secondary{padding:10px 16px;border-radius:9px;border:1px solid var(--blue);font-size:14px;font-weight:bold}.primary{background:var(--navy);color:white}.secondary{background:white;color:var(--navy)}.primary:hover{background:#265c98}.secondary:hover{background:var(--pale)}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 22px}.stat{font-size:13px;color:#365a7b}.progress{height:9px;background:#e2edf6;border-radius:10px;overflow:hidden;margin:9px 0}.bar{height:100%;background:#3b80bd;width:0;transition:width .2s}h2{font-family:Verdana,sans-serif;color:var(--navy);font-size:23px;margin:0 0 8px}h3{font-family:Tahoma,Arial,sans-serif;color:var(--navy);font-size:17px}p{text-align:justify}.lesson{border-left:4px solid #5b95c6;background:#f1f7fd;padding:14px 18px;margin:20px 0;border-radius:4px}.lesson p{margin:5px 0}.question{border:1px solid var(--line);padding:17px;margin:14px 0;border-radius:12px;background:#fff}.qtop{display:flex;justify-content:space-between;align-items:center;gap:12px}.qnum{color:#426d95;font-size:12px;font-weight:bold}.qtitle{font-weight:bold;margin:8px 0 14px}.option{display:block;padding:9px 10px;margin:7px 0;border:1px solid #d3e2ee;border-radius:8px;cursor:pointer}.option:has(input:checked){background:var(--pale);border-color:#4b8fc8}input[type=radio]{accent-color:#245d99;margin-right:8px}textarea{width:100%;min-height:75px;border:1px solid #abc8df;border-radius:7px;padding:11px;font:16px Arial,sans-serif;resize:vertical;color:#183c64}textarea:focus{outline:2px solid #82b6e2}.feedback{margin-top:12px;padding:12px;border-radius:8px;background:#eaf3fb;border-left:3px solid #397bb2;font-size:14px}.hidden{display:none}.tag{background:#eaf3fb;border-radius:6px;padding:3px 8px;color:#275d91;font-size:12px}.foot{display:flex;justify-content:space-between;gap:8px;margin-top:22px;flex-wrap:wrap}.small{font-size:13px;color:#53718c}.mobilemenu{display:none}@media(max-width:750px){.layout{display:block;margin:10px auto}.sidebar{position:static;margin-bottom:12px}.sidebar nav{display:grid;grid-template-columns:1fr 1fr;gap:4px}.main,.sidebar{padding:15px}header{padding:22px 18px}header h1{font-size:22px}}@media print{body{background:white;font-size:12pt}.layout{display:block}.sidebar,.tools,.foot,.question button{display:none!important}.main{border:0;padding:0}.question{break-inside:avoid}textarea{min-height:70px}header{background:white;color:#173d72;padding:0 0 16px}header p{color:#173d72}}
</style></head><body><header><h1>ENGLISH IN CONTEXT</h1><p>Digital Activity Workbook · B1–C2 · Learn, practise, check, repeat</p></header><div class="layout"><aside class="sidebar"><h2>UNIDADES</h2><nav id="nav"></nav><hr style="border:0;border-top:1px solid #d4e4f1;margin:18px 0"><div class="stat" id="progressText"></div><div class="progress"><div class="bar" id="progressBar"></div></div><div class="tools"><button class="secondary" id="export">Exportar respuestas</button><button class="secondary" id="import">Importar respuestas</button><input type="file" id="file" accept="application/json" hidden></div><div class="small">Tus respuestas se guardan automáticamente en este dispositivo. Exporta una copia para no perderlas.</div></aside><main class="main"><div id="content"></div><div class="foot"><button class="secondary" id="prev">← Anterior</button><button class="primary" id="next">Siguiente unidad →</button></div></main></div><script>
const units=[["Question order & prepositions", "B1–C1", "Ordena preguntas, distingue auxiliares y conserva las preposiciones que corresponden al verbo.", [["choice", "Which question is correct?", ["Where you are from?", "Where are you from?", "From where you are?"], 1, "Where + be + subject. «From» se coloca naturalmente al final."], ["choice", "Choose the natural question.", ["Who did you go with?", "With who you went?", "Who you went with?"], 0, "Who + did + subject + base verb + with."], ["choice", "Choose the correct indirect question.", ["Do you know where is she?", "Do you know where she is?", "Do you know where does she live?"], 1, "En preguntas indirectas no se invierte sujeto y verbo."], ["text", "Rewrite as a question: “You are looking for something.” Ask about the thing.", "What are you looking for?", "What + are + you + looking for?"], ["text", "Ask about the person: “I was speaking to Maria.”", "Who were you speaking to?", "La preposición to permanece después del verbo speaking."], ["text", "Translate naturally: «¿De qué depende?»", "What does it depend on?", "Depend on es una combinación fija."], ["choice", "What does “What are you getting at?” mean?", ["What are you reaching physically?", "What are you implying?", "Where are you traveling?"], 1, "Get at puede significar insinuar o querer decir algo."], ["text", "Ask politely: «¿Podrías decirme dónde trabaja él?»", "Could you tell me where he works?", "Could you tell me + sujeto + verbo."]]], ["Gerunds & infinitives", "B1–C2", "Aprende cuándo usar -ing, to + verbo y cómo cambia el significado.", [["choice", "I enjoy ___ new languages.", ["learn", "learning", "to learning"], 1, "Enjoy + gerund."], ["choice", "She decided ___ abroad.", ["studying", "study", "to study"], 2, "Decide + to-infinitive."], ["choice", "I am used to ___ early.", ["wake up", "waking up", "woke up"], 1, "Be used to + noun/gerund: aquí to es preposición."], ["choice", "I stopped ___ because it was unhealthy.", ["smoking", "to smoke", "smoke"], 0, "Stop doing = dejar una actividad."], ["choice", "We stopped ___ some coffee on the way.", ["buying", "to buy", "buy"], 1, "Stop to do = detenerse con un propósito."], ["choice", "I remember ___ the door before leaving.", ["locking", "to lock", "lock"], 0, "Remember doing = recordar una acción pasada."], ["text", "Complete: “I look forward to ___ (hear) from you.”", "hearing", "Look forward to + -ing."], ["text", "Complete: “They avoided ___ (answer) the question.”", "answering", "Avoid + -ing."], ["choice", "Choose the correct sentence.", ["I suggest to wait.", "I suggest waiting.", "I suggest wait."], 1, "Suggest + -ing o suggest that + clause."], ["text", "Rewrite: “I no longer work nights.” Use “used to”.", "I used to work nights.", "Used to + base verb = hábito pasado."], ["choice", "Which is correct?", ["It is worth trying.", "It is worth to try.", "It is worth try."], 0, "Worth + -ing."], ["text", "Complete: “She admitted ___ (make) a mistake.”", "making", "Admit + gerund."]]], ["Approximation & softening", "B1–C2", "Kind of, sort of, more or less, give or take: aproxima sin perder precisión.", [["choice", "“I’m kind of tired” means…", ["I am a type of tiredness", "I am somewhat tired", "I am completely exhausted"], 1, "Kind of = somewhat, informal."], ["choice", "“We need an hour, give or take” means…", ["exactly one hour", "approximately one hour", "one hour more"], 1, "Give or take = más o menos, con margen."], ["choice", "Choose the most natural sentence.", ["I sort of agree.", "I agree sort of of.", "I am sort agree."], 0, "Sort of suaviza la afirmación."], ["text", "Complete: “The plan is ___ ___ ready.” (more or less)", "more or less", "More or less = aproximadamente / en términos generales."], ["choice", "“It kind of slipped my mind” suggests…", ["I intentionally forgot", "I somewhat forgot / it escaped my memory", "I dropped a paper"], 1, "Slip my mind = olvidarse, sentido figurado."], ["text", "Write a natural estimate: “The drive takes 40 minutes, ___ ___ ___.”", "give or take", "Give or take va al final de una estimación."], ["choice", "Which is more suitable in a formal report?", ["The results are kind of good.", "The results are broadly positive.", "The results are sorta good."], 1, "Broadly positive es más apropiado en escritura formal."], ["text", "Complete: “I ___ ___ understand your point.”", "sort of", "Sort of indica comprensión parcial."]]], ["Quantifiers & degree", "B1–C2", "Quite, a lot, several, many, much, few y little según cantidad, intensidad y registro.", [["choice", "Choose the correct expression.", ["many information", "much information", "several information"], 1, "Information es incontable."], ["choice", "I have ___ close friends, but not many.", ["a few", "few of", "a little"], 0, "A few + plural countable."], ["choice", "There is ___ time left; hurry!", ["few", "little", "several"], 1, "Little + uncountable indica escasez."], ["choice", "“Quite interesting” in American English usually means…", ["fairly / rather interesting", "not interesting at all", "exactly interesting"], 0, "Quite puede variar con el contexto y la variedad del inglés."], ["choice", "We received ___ applications.", ["a lot of", "a lot", "much"], 0, "A lot of + noun."], ["text", "Complete: “There are ___ reasons to reconsider.” (several)", "several", "Several + sustantivo plural contable."], ["choice", "Choose the natural question.", ["How many money do you need?", "How much money do you need?", "How several money do you need?"], 1, "Money es incontable."], ["text", "Complete: “She has ___ ___ experience.” (a lot of)", "a lot of", "A lot of se usa con contables e incontables."]]], ["Indefinite pronouns", "B1–C2", "Anyone, anybody, someone, somebody, anything y nothing en preguntas, afirmaciones y negaciones.", [["choice", "I didn’t see ___ at the office.", ["nobody", "anybody", "somebody never"], 1, "Not + anybody evita doble negación estándar."], ["choice", "___ left a message for you.", ["Somebody", "Anybody not", "Nothing"], 0, "Somebody = alguna persona no identificada."], ["choice", "Is there ___ I can do?", ["nothing", "anything", "anybody"], 1, "Anything en preguntas abiertas."], ["choice", "“Nobody knows” is…", ["grammatically affirmative with negative meaning", "a double negative", "always a question"], 0, "Nobody ya aporta negación; el verbo va afirmativo."], ["text", "Complete: “I have ___ to add.” (nothing)", "nothing", "Nothing = ninguna cosa."], ["choice", "Would you like ___ to drink?", ["something", "anything never", "nothing"], 0, "Something en ofertas y peticiones donde se anticipa respuesta positiva."], ["choice", "Choose the natural sentence.", ["Everyone are ready.", "Everyone is ready.", "Everyone be ready."], 1, "Everyone toma verbo singular."], ["text", "Complete: “Has ___ seen my keys?” (anyone)", "anyone", "Anyone = alguna persona, típico en preguntas."]]], ["Comparisons & similarity", "B1–C2", "Such, so, like, alike, look alike, such as: funciones distintas.", [["choice", "It was ___ an inspiring speech!", ["so", "such", "like"], 1, "Such + a/an + adjective + singular countable noun."], ["choice", "She is ___ talented.", ["such", "so", "alike"], 1, "So + adjective."], ["choice", "They look ___.", ["like", "alike", "such"], 1, "Look alike = parecerse entre sí."], ["choice", "She looks ___ her sister.", ["like", "alike", "such as"], 0, "Look like + person / noun."], ["choice", "Cities ___ London and Toronto are expensive.", ["such as", "alike", "so"], 0, "Such as introduce ejemplos."], ["text", "Complete: “I’ve never seen ___ a beautiful place.”", "such", "Such + a + adjective + noun."], ["choice", "Which is correct?", ["They are alike.", "They are like.", "They are such."], 0, "Alike funciona como adjetivo predicativo."], ["text", "Complete: “He speaks ___ a professional.”", "like", "Like + noun = similar a."]]], ["Connectors & conditions", "B1–C2", "As well, as well as, as long as, unless: añade, compara y condiciona.", [["choice", "I speak English and Spanish ___.", ["as well", "as long as", "as well as"], 0, "As well suele ir al final."], ["choice", "She speaks French ___ English.", ["as well", "as well as", "as long as"], 1, "As well as + noun/gerund."], ["choice", "You can join us ___ you arrive on time.", ["as long as", "as well", "alike"], 0, "As long as = siempre que / con tal de que."], ["choice", "“As long as you need” means…", ["provided that", "for whatever amount of time you need", "in addition"], 1, "As long as también expresa duración, según el contexto."], ["text", "Complete: “I will help you ___ ___ ___ you are honest.”", "as long as", "As long as expresa condición."], ["choice", "“Unless it rains, we’ll go” means…", ["If it rains, we will go", "If it does not rain, we will go", "Even if it rains, we will go"], 1, "Unless = if not."], ["text", "Complete: “He is creative and very reliable ___ ___.”", "as well", "As well = también."], ["choice", "Which sentence is natural?", ["As well as managing, she teaches.", "As well managing, she teaches.", "As well to manage, she teaches."], 0, "As well as + gerund."]]], ["Distance, movement & descriptions", "B1–C2", "Long, far, away, run away, runaway, sticky, foggy, savory y familias léxicas.", [["choice", "How ___ is the airport?", ["long", "far", "away from"], 1, "How far pregunta por distancia."], ["choice", "How ___ does the journey take?", ["long", "far", "away"], 0, "How long pregunta por duración."], ["choice", "The station is two miles ___.", ["far", "away", "long"], 1, "Distance + away."], ["choice", "“Run away” means…", ["escape / leave suddenly", "run at high speed only", "return home"], 0, "Run away = huir / escaparse."], ["choice", "A “runaway success” is…", ["a person escaping", "an overwhelming success", "a distant success"], 1, "Runaway puede ser figurado: extraordinario / descontrolado."], ["choice", "The floor feels ___.", ["foggy", "sticky", "savory"], 1, "Sticky = pegajoso."], ["choice", "The morning is ___; visibility is poor.", ["savory", "foggy", "sticky"], 1, "Foggy = con niebla; también foggy memory = memoria borrosa."], ["choice", "I prefer ___ snacks to sweet ones.", ["savory", "foggy", "away"], 0, "Savory = salado / no dulce, en contexto culinario."], ["text", "Complete: “The meeting lasted three hours. How ___ was it?”", "long", "How long para duración."], ["text", "Complete: “The hotel is five minutes ___.”", "away", "Away expresa separación espacial o temporal."], ["choice", "“A sticky situation” is…", ["an awkward/difficult situation", "a room full of glue", "a cold morning"], 0, "Sticky puede ser figurado: situación delicada."], ["choice", "“My memory is a bit foggy” means…", ["I remember perfectly", "I cannot remember clearly", "I am hungry"], 1, "Foggy = poco claro, figurado."]]]];const key='english-context-blue-v1';let state={unit:0,answers:{},revealed:{}};try{const saved=JSON.parse(localStorage.getItem(key));if(saved&&typeof saved==='object')state={...state,...saved}}catch(e){};
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}};
function normalize(s){return String(s||'').toLowerCase().replace(/[‘’]/g,"'").replace(/[^a-z0-9' ]/g,'').replace(/\s+/g,' ').trim()}
function updateProgress(){let total=0,answered=0,checked=0,correct=0;units.forEach((u,ui)=>u[3].forEach((q,qi)=>{total++;let id=ui+'-'+qi;if(state.answers[id]!==undefined&&String(state.answers[id]).trim()!=='')answered++;if(state.revealed[id]){checked++;if(q[0]==='choice'?Number(state.answers[id])===q[3]:normalize(state.answers[id])===normalize(q[3]))correct++}}));$('#progressText').textContent=`${answered}/${total} respondidas · ${checked} revisadas · ${correct} exactas`;$('#progressBar').style.width=(answered/total*100)+'%'}
function render(){const u=units[state.unit];$('#nav').innerHTML=units.map((x,i)=>`<button class="unitbtn ${i===state.unit?'active':''}" data-unit="${i}">${i+1}. ${esc(x[0])}</button>`).join('');$('#content').innerHTML=`<div class="small">UNIDAD ${state.unit+1} DE ${units.length} · ${esc(u[1])}</div><h2>${esc(u[0])}</h2><p>${esc(u[2])}</p><div class="lesson"><h3>Regla esencial y cómo estudiar</h3><p>Lee el enunciado, identifica la estructura, responde sin traducir palabra por palabra y pulsa <b>Comprobar</b>. En preguntas abiertas, la corrección automática compara con el modelo; otras respuestas equivalentes pueden ser válidas.</p><p><b>Objetivo:</b> gramática correcta, significado natural y uso en contexto.</p></div><h3>Actividades</h3>${u[3].map((q,i)=>question(q,i)).join('')}<div class="lesson"><b>Producción libre</b><p>Escribe tres oraciones o preguntas originales con las estructuras de esta unidad. Explícalas en español y di en qué situación las usarías.</p><textarea data-free="${state.unit}" placeholder="Mis ejemplos, traducciones y notas...">${esc(state.answers['free-'+state.unit]||'')}</textarea></div>`;$('#prev').disabled=state.unit===0;$('#next').disabled=state.unit===units.length-1;updateProgress()}
function question(q,i){const id=state.unit+'-'+i;const answer=state.answers[id];const shown=!!state.revealed[id];const correct=shown&&(q[0]==='choice'?Number(answer)===q[3]:normalize(answer)===normalize(q[3]));return `<section class="question"><div class="qtop"><span class="qnum">EJERCICIO ${i+1} · ${q[0]==='choice'?'SELECCIÓN':'RESPUESTA ESCRITA'}</span><span class="tag">${esc(units[state.unit][1])}</span></div><div class="qtitle">${esc(q[1])}</div>${q[0]==='choice'?q[2].map((opt,j)=>`<label class="option"><input type="radio" name="q-${id}" data-id="${id}" value="${j}" ${String(answer)===String(j)?'checked':''}>${esc(opt)}</label>`).join(''):`<textarea data-id="${id}" placeholder="Escribe aquí tu respuesta...">${esc(answer||'')}</textarea>`}<button class="secondary" data-check="${id}">${shown?'Volver a comprobar':'Comprobar respuesta'}</button>${shown?`<div class="feedback"><b>${correct?'Respuesta correcta.':'Revisa el modelo y la explicación.'}</b><div><b>Modelo:</b> ${esc(q[0]==='choice'?q[2][q[3]]:q[3])}</div><div><b>Por qué:</b> ${esc(q[4])}</div>${q[0]==='text'?'<div class="small">Nota: la coincidencia automática es estricta; una respuesta distinta puede ser correcta.</div>':''}</div>`:''}</section>`}
document.addEventListener('input',e=>{if(e.target.matches('textarea[data-id]')){state.answers[e.target.dataset.id]=e.target.value;save();updateProgress()}if(e.target.matches('textarea[data-free]')){state.answers['free-'+e.target.dataset.free]=e.target.value;save()}});document.addEventListener('change',e=>{if(e.target.matches('input[data-id]')){state.answers[e.target.dataset.id]=Number(e.target.value);save();render()}});document.addEventListener('click',e=>{const n=e.target.closest('[data-unit]');if(n){state.unit=Number(n.dataset.unit);save();render();window.scrollTo(0,0)}const b=e.target.closest('[data-check]');if(b){state.revealed[b.dataset.check]=true;save();render();document.querySelector(`[data-check="${b.dataset.check}"]`)?.scrollIntoView({block:'center',behavior:'smooth'})}});$('#prev').onclick=()=>{if(state.unit>0){state.unit--;save();render();window.scrollTo(0,0)}};$('#next').onclick=()=>{if(state.unit<units.length-1){state.unit++;save();render();window.scrollTo(0,0)}};$('#export').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-english-workbook-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('#import').onclick=()=>$('#file').click();$('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(typeof d.answers!=='object'||!d.answers)throw Error('Formato no válido');state={unit:Math.min(Math.max(Number(d.unit)||0,0),units.length-1),answers:d.answers,revealed:d.revealed||{}};save();render()}catch(e){alert('No se pudo importar el archivo.')}};render();
</script></body></html>
